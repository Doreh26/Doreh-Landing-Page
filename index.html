<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doreh — Every event, beautifully created</title>
<meta name="description" content="From the first invitation to the last photo, every part of your event in one beautiful place.">
<meta property="og:title" content="Doreh — Every event, beautifully created">
<meta property="og:description" content="From the first invitation to the last photo, every part of your event in one beautiful place. Request early access.">
<meta property="og:image" content="https://doreh.com/assets/hero-wedding.jpg">
<meta name="theme-color" content="#1b140d">
<link rel="preload" as="image" href="/assets/hero-wedding.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1813;--espresso:#1B140D;--gold:#C8941A;--gold-deep:#9A6F12;--champagne:#E5C158;--cream:#FBF5E9;
  --serif:'Cormorant Garamond',Georgia,serif;--display:'Bodoni Moda',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--espresso);color:var(--cream);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* top bar: logo + log in, nothing else */
.top{position:fixed;top:0;left:0;right:0;z-index:10;padding:22px clamp(22px,4vw,56px);padding-top:max(22px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between}
.mark{color:#fff;display:flex}
.login{font-size:14px;font-weight:500;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:10px 22px;transition:background .2s,border-color .2s}
.login:hover{background:rgba(255,255,255,.12);border-color:#fff}

/* full-bleed hero */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--espresso)}
.photo{position:absolute;inset:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}
.bg.on{opacity:1}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(232,200,140,.26),rgba(27,20,13,.30) 70%,rgba(201,144,26,.2));mix-blend-mode:multiply}
.scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(95deg,rgba(20,15,9,.82),rgba(20,15,9,.5) 42%,rgba(20,15,9,.06) 74%),linear-gradient(0deg,rgba(20,15,9,.78),rgba(20,15,9,0) 56%)}
.inner{position:relative;z-index:2;width:100%;max-width:1320px;margin:0 auto;padding:120px clamp(22px,4vw,56px) clamp(56px,10vh,120px)}
.mast{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.mast .em{font-family:var(--display);font-style:italic;font-size:15px;color:var(--champagne)}
.mast .ln{height:.5px;background:rgba(255,255,255,.3);width:120px}
.mast .lbl{font-size:10.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.72)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(43px,7.05vw,102px);line-height:.92;letter-spacing:-1.5px;color:var(--cream);max-width:760px;text-wrap:balance}
h1 em{font-style:italic;color:var(--champagne)}
.sub{font-size:clamp(16px,1.4vw,19px);font-weight:300;line-height:1.66;color:rgba(255,255,255,.82);max-width:33em;margin-top:24px}

/* early access: one box holds who you are, your email and the button */
.ea{margin-top:34px;max-width:560px}
.ea-box{background:rgba(20,15,9,.5);border:1px solid rgba(255,255,255,.28);border-radius:24px;padding:8px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s}
.ea-box:focus-within{border-color:var(--champagne)}
.as{display:flex;align-items:center;gap:6px;padding:4px 4px 10px 12px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14)}
.as span{font-size:13px;color:rgba(255,255,255,.62);margin-right:6px;white-space:nowrap}
.as label{cursor:pointer;flex:1}
.as input{position:absolute;opacity:0;pointer-events:none}
.as b{display:block;text-align:center;font-weight:400;font-size:14px;color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 0;transition:all .15s}
.as label:hover b{border-color:rgba(255,255,255,.5)}
.as input:checked+b{background:var(--champagne);border-color:var(--champagne);color:var(--espresso);font-weight:500}
.as input:focus-visible+b{outline:2px solid var(--champagne);outline-offset:2px}
.ea-row{display:flex;gap:8px}
.ea input[type=email]{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:400 16px var(--sans);padding:0 12px}
.ea input[type=email]::placeholder{color:rgba(255,255,255,.55)}
.ea button{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#fff;border:0;border-radius:999px;
  font:500 15px var(--sans);letter-spacing:.2px;padding:14px 26px;cursor:pointer;box-shadow:0 12px 32px -10px rgba(200,148,26,.6);transition:transform .2s var(--ease),opacity .2s}
.ea button:hover{transform:translateY(-1px)}
.ea button[disabled]{opacity:.6;cursor:default;transform:none}
.ea button svg{width:16px;height:16px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.msg{min-height:20px;margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.7)}
.msg.err{color:#F2B8A0}
.done{display:none;margin-top:34px;max-width:560px;border:1px solid rgba(229,193,88,.5);background:rgba(20,15,9,.5);border-radius:18px;padding:20px 24px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.done b{display:block;font-family:var(--serif);font-weight:500;font-size:28px;color:var(--cream)}
.done b em{color:var(--champagne)}
.done p{margin-top:6px;font-size:14.5px;color:rgba(255,255,255,.78)}
.sent .ea{display:none}.sent .done{display:block}

.legal{position:absolute;z-index:2;right:clamp(22px,4vw,56px);bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:18px;font-size:12px;color:rgba(255,255,255,.5)}
.legal a:hover{color:#fff}

@media (max-width:640px){
  .inner{padding-bottom:84px}
  .mast .ln{width:28px}
  .mast .lbl{font-size:9.5px;letter-spacing:2px}
  .as{padding-left:6px}
  .as span{margin-right:2px}
  .ea-row{flex-direction:column;gap:6px}
  .ea input[type=email]{padding:14px 10px}
  .ea button{justify-content:center;width:100%}
  .legal{left:22px;right:auto}
}
@media (prefers-reduced-motion:reduce){.bg{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a href="/" class="mark" aria-label="doreh"><svg width="21" height="28" viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="20" r="10"></circle><line x1="23" y1="2" x2="23" y2="30" stroke-linecap="square"></line></svg></a>
</header>

<main class="hero" id="hero">
  <div class="photo" aria-hidden="true">
    <div class="bg on" style="background-image:url('/assets/hero-wedding.jpg')"></div>
    <div class="bg" data-src="/assets/hero-bbq.jpg"></div>
    <div class="bg" data-src="/assets/hero-babyshower.jpg"></div>
    <div class="bg" data-src="/assets/hero-firstbirthday.jpg"></div>
    <div class="bg" data-src="/assets/hero-thanksgiving.jpg"></div>
    <div class="bg" data-src="/assets/hero-graduation.jpg"></div>
  </div>
  <div class="scrim"></div>
  <div class="inner">
    <div class="mast"><span class="em">✦</span><span class="ln"></span><span class="lbl">The home for every event in your life</span></div>
    <h1>Every event, beautifully created.<br><em>Remembered forever.</em></h1>
    <p class="sub">From the first invitation to the last photo, every part of your event in one beautiful place.</p>

    <form class="ea" id="ea" novalidate>
      <div class="ea-box">
        <div class="as" role="radiogroup" aria-label="I'm a">
          <span>I'm a</span>
          <label><input type="radio" name="role" value="host"><b>Host</b></label>
          <label><input type="radio" name="role" value="planner"><b>Planner</b></label>
          <label><input type="radio" name="role" value="vendor"><b>Vendor</b></label>
        </div>
        <div class="ea-row">
          <input type="email" name="email" id="email" placeholder="Your email" autocomplete="email" required aria-label="Email">
          <button type="submit" id="go">Request early access
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <div class="done" role="status"><b>You're <em>on the list.</em></b><p>We'll email you when your invite is ready.</p></div>
  </div>
  <!-- gstack-shortcut(dec-f9fafb2d): hero only, no product screens; upgrade when sign-ups stall or an engineer is hired (add Invite/Gather/Give/Keep strip) -->
  <nav class="legal"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="mailto:hello@doreh.com">Contact</a></nav>
</main>

<script>
(function(){
  // crossfade the hero photos; load each one only when it is about to show
  var bgs=[].slice.call(document.querySelectorAll('.bg'));
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function load(el){var s=el.getAttribute('data-src');if(s){el.style.backgroundImage="url('"+s+"')";el.removeAttribute('data-src')}}
  var i=0; setTimeout(function(){load(bgs[1])},2500);
  setInterval(function(){bgs[i].classList.remove('on');i=(i+1)%bgs.length;load(bgs[i]);bgs[i].classList.add('on');load(bgs[(i+1)%bgs.length])},5200);
})();
(function(){
  var f=document.getElementById('ea'),go=document.getElementById('go'),msg=document.getElementById('msg'),em=document.getElementById('email');
  function say(t,err){msg.textContent=t;msg.className='msg'+(err?' err':'')}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var email=em.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){say('Enter a valid email.',true);em.focus();return}
    var picked=f.querySelector('input[name=role]:checked');
    if(!picked){say('Pick Host, Planner or Vendor.',true);return}
    var role=picked.value;
    go.disabled=true;say('');
    fetch('/api/early-access',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:email,role:role,website:f.website.value,ref:document.referrer||''})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.error||'');return d})})
      .then(function(){document.getElementById('hero').classList.add('sent');try{window.va('event',{name:'early_access',data:{role:role}})}catch(e){}})
      .catch(function(err){go.disabled=false;say(err.message||'That did not go through. Try again.',true)});
  });
})();
</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
